title: minionxmatcha
description: Matcha reviews, cafe walkthroughs & tea guides in Singapore.
url: "https://minionxmatcha.github.io"
baseurl: ""
lang: en-SG

# Read post dates in Singapore time (stops early-morning posts showing 404)
timezone: Asia/Singapore

# Keep the original .html post addresses so old links keep working
permalink: /:year/:month/:day/:title:output_ext

# Fallback only: your own layouts in _layouts/ are used first
theme: minima

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Used by Google and link previews
social:
  name: minionxmatcha
  links:
    - https://www.instagram.com/minionxmatcha
    - https://www.tiktok.com/@minionxmatcha
    - https://www.facebook.com/p/Minionxmatcha-61592062657121/
    - https://www.youtube.com/@minionxmatcha
